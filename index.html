<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Портфолио графического дизайнера и иллюстратора Яны Пономаревой.">
  <meta name="theme-color" content="#0b0b0b">
  <title>Яна Пономарева — графический дизайнер</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header" aria-label="Навигация по портфолио">
    <a class="brand" href="#top">ЯНА ПОНОМАРЕВА</a>
    <nav>
      <a href="#about">О себе</a>
      <a href="#projects">Проекты</a>
      <a href="#contacts">Связь</a>
    </nav>
  </header>

  <main id="top" class="portfolio">
    <section class="portfolio-screen" aria-label="Обложка портфолио">
      <img src="portfolio-01.jpg" alt="Обложка портфолио Яны Пономаревой" width="1456" height="1024">
    </section>

    <section id="about" class="portfolio-screen" aria-label="О себе">
      <img src="portfolio-02.jpg" alt="Информация о дизайнере, образовании и инструментах" loading="lazy">
    </section>

    <section class="portfolio-screen" aria-label="Профессиональные навыки">
      <img src="portfolio-03.jpg" alt="Профессиональные и гибкие навыки" loading="lazy">
    </section>

    <section class="portfolio-screen" aria-label="Опыт работы">
      <img src="portfolio-04.jpg" alt="Опыт работы в музее и на фрилансе" loading="lazy">
    </section>

    <section class="portfolio-screen" aria-label="Ключевые достижения">
      <img src="portfolio-05.jpg" alt="Ключевые профессиональные достижения" loading="lazy">
    </section>

    <div id="projects" class="anchor" aria-hidden="true"></div>

    <section class="portfolio-screen project-screen" aria-label="Сувенирная продукция">
      <img src="portfolio-06.jpg" alt="Проект сувенирной продукции и термосов" loading="lazy">
    </section>

    <section class="portfolio-screen project-screen" aria-label="Румбокс и стикерпак">
      <img src="portfolio-07.jpg" alt="Проекты румбокса и музейного стикерпака" loading="lazy">
    </section>

    <section class="portfolio-screen project-screen" aria-label="Социальные сети и афиши">
      <img src="portfolio-08.jpg" alt="Дизайн социальных сетей и афиш" loading="lazy">
    </section>

    <section class="portfolio-screen project-screen" aria-label="Фирменный стиль">
      <img src="portfolio-09.jpg" alt="Проекты фирменного стиля" loading="lazy">
    </section>

    <section class="portfolio-screen project-screen" aria-label="Оформление мероприятия">
      <img src="portfolio-10.jpg" alt="Оформление музейного мероприятия" loading="lazy">
    </section>

    <section class="portfolio-screen project-screen" aria-label="Типографика и дизайн одежды">
      <img src="portfolio-11.jpg" alt="Типографика, стенды, листы, марки и дизайн одежды" loading="lazy">
    </section>

    <section id="contacts" class="portfolio-screen" aria-label="Контакты">
      <img src="portfolio-12.jpg" alt="Контакты Яны Пономаревой" loading="lazy">
    </section>
  </main>

  <button class="to-top" type="button" aria-label="Вернуться наверх">↑</button>

  <dialog class="lightbox" aria-label="Увеличенный экран портфолио">
    <button class="lightbox-close" type="button" aria-label="Закрыть">×</button>
    <img src="" alt="">
  </dialog>

  <script src="script.js"></script>
</body>
</html>
